[package]
name = "chainfold"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
futures-core = "0.3"
futures-util = "0.3"
tokio-util = "0.7"    # CancellationToken (included by default, no "sync" feature in 0.7)
rusqlite = { version = "0.34", features = ["bundled"] }
rusqlite_migration = "2"
postcard = { version = "1", features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
futures-util = "0.3"
tempfile = "3"
