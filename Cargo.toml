[package]
name = "chainfold"
version = "0.1.0"
edition = "2024"

[features]
evm = ["dep:alloy", "dep:tracing", "dep:blake3"]
cli = [
  "evm",
  "dep:clap",
  "dep:tracing-subscriber",
  "dep:chrono",
  "dep:toml",
  "dep:dirs",
  "dep:tempfile",
]

[dependencies]
tokio = { version = "1", features = [
  "sync",
  "time",
  "macros",
  "rt-multi-thread",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
futures-core = "0.3"
futures-util = "0.3"
tokio-util = "0.7" # CancellationToken (included by default, no "sync" feature in 0.7)
rusqlite = { version = "0.34", features = ["bundled"] }
rusqlite_migration = "2"
postcard = { version = "1", features = ["alloc"] }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
tiny-keccak = { version = "2", features = ["keccak"] }
alloy = { version = "1", features = [
  "provider-http",
  "provider-ws",
  "pubsub",
  "rpc-types",
  "sol-types",
  "json-abi",
], optional = true }
tracing = { version = "0.1", optional = true }
blake3 = { version = "1.8", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
], optional = true }
chrono = { version = "0.4", optional = true }
toml = { version = "0.8", optional = true }
dirs = { version = "6", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
futures-util = "0.3"
tempfile = "3"
alloy = { version = "1", features = [
  "provider-http",
  "provider-ws",
  "pubsub",
  "rpc-types",
  "sol-types",
  "contract",
  "json-abi",
] }
alloy-node-bindings = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
dotenvy = "0.15"

[[bin]]
name = "chainfold"
path = "src/bin/chainfold/main.rs"
required-features = ["cli"]

[[test]]
name = "anvil_smoke"
required-features = ["evm"]

[[test]]
name = "mock_provider_smoke"
required-features = ["evm"]

[[test]]
name = "phase1_layering"
required-features = ["evm"]

[[test]]
name = "phase2_push"
required-features = ["evm"]

[[test]]
name = "phase3_hist_store"

[[test]]
name = "phase5_merge"

[[test]]
name = "phase6_matcher"

[[test]]
name = "owned_erc20"
required-features = ["evm"]

[[example]]
name = "history_explorer"
required-features = ["evm"]

[[example]]
name = "erc20_explorer"
required-features = ["evm"]

[[example]]
name = "bridge_explorer"
required-features = ["evm"]

[[example]]
name = "bridge_matcher"
required-features = ["evm"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Baseline groups.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Catch the specific issues feedback has flagged before.
absolute_paths = "warn"          # forces `use` over `crate::a::b::c` chains
needless_pass_by_value = "warn"
redundant_clone = "warn"
explicit_iter_loop = "warn"
explicit_into_iter_loop = "warn"
unused_async = "warn"
# Common pedantic noise we don't care about in a CLI / library.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
struct_excessive_bools = "allow"
# Don't fight the `_` underscore-bound naming when we're documenting params.
similar_names = "allow"
# EVM numeric work routinely converts between u32/u64/usize/i64 (SQLite)
# at known-safe boundaries. Forcing try_into chains everywhere produces
# more noise than it catches.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
# Long functions are usually long for a reason in this codebase (state
# machines, schema migrations, integration scenarios).
too_many_lines = "allow"
# `let _ = future_with_unit_result();` reads fine and is widely used.
ignored_unit_patterns = "allow"
# `Hist::iter`/`HistBackend::iter` return a Stream, not Iterator — the name
# is part of the trait/API surface and matches the conceptual operation.
iter_not_returning_iterator = "allow"
# Clap's `EvmArgs` is large relative to the small `Config { action }` arm.
# Splitting the enum into boxed variants would obscure the CLI surface.
large_enum_variant = "allow"
# CLI run functions thread provider+cache+args+chain_id+flags — splitting
# them into structs to satisfy a 7-arg cap costs clarity.
too_many_arguments = "allow"
# Items defined inside a function body after let-statements are a clarity
# choice; allow it for local helper fns near their call site.
items_after_statements = "allow"
