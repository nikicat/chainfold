[package]
name = "chainfold"
version = "0.1.0"
edition = "2021"

[features]
evm = ["dep:alloy", "dep:tracing", "dep:blake3"]

[dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
futures-core = "0.3"
futures-util = "0.3"
tokio-util = "0.7"    # CancellationToken (included by default, no "sync" feature in 0.7)
rusqlite = { version = "0.34", features = ["bundled"] }
rusqlite_migration = "2"
postcard = { version = "1", features = ["alloc"] }
alloy = { version = "1", features = ["provider-http", "rpc-types", "sol-types"], optional = true }
tracing = { version = "0.1", optional = true }
blake3 = { version = "1.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
futures-util = "0.3"
tempfile = "3"
alloy = { version = "1", features = ["provider-http", "rpc-types", "sol-types"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[test]]
name = "erc20_tests"
required-features = ["evm"]

[[example]]
name = "history_explorer"
required-features = ["evm"]

[[example]]
name = "erc20_explorer"
required-features = ["evm"]
