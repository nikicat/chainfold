[package]
name = "chainfold"
version = "0.1.0"
edition = "2021"

[features]
evm = ["dep:alloy", "dep:tracing", "dep:blake3"]
cli = ["evm", "dep:clap", "dep:hex", "dep:tracing-subscriber", "dep:chrono", "dep:toml", "dep:dirs"]

[dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
futures-core = "0.3"
futures-util = "0.3"
tokio-util = "0.7"    # CancellationToken (included by default, no "sync" feature in 0.7)
rusqlite = { version = "0.34", features = ["bundled"] }
rusqlite_migration = "2"
postcard = { version = "1", features = ["alloc"] }
alloy = { version = "1", features = ["provider-http", "provider-ws", "pubsub", "rpc-types", "sol-types"], optional = true }
tracing = { version = "0.1", optional = true }
blake3 = { version = "1.8", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
hex = { version = "0.4", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
chrono = { version = "0.4", optional = true }
toml = { version = "0.8", optional = true }
dirs = { version = "6", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
futures-util = "0.3"
tempfile = "3"
alloy = { version = "1", features = ["provider-http", "provider-ws", "pubsub", "rpc-types", "sol-types", "contract", "json-abi"] }
alloy-node-bindings = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
dotenvy = "0.15"

[[bin]]
name = "chainfold"
path = "src/bin/chainfold/main.rs"
required-features = ["cli"]

[[test]]
name = "anvil_smoke"
required-features = ["evm"]

[[test]]
name = "mock_provider_smoke"
required-features = ["evm"]

[[test]]
name = "phase1_layering"
required-features = ["evm"]

[[test]]
name = "phase2_push"
required-features = ["evm"]

[[test]]
name = "phase3_hist_store"

[[example]]
name = "history_explorer"
required-features = ["evm"]

[[example]]
name = "erc20_explorer"
required-features = ["evm"]
