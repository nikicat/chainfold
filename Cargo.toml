[package]
name = "chainfold"
version = "0.1.0"
edition = "2024"

[features]
evm = ["dep:alloy"]
bitcoin = ["dep:jsonrpc"]
cli = [
  "evm",
  "bitcoin",
  "dep:clap",
  "dep:tracing-subscriber",
  "dep:chrono",
  "dep:toml",
  "dep:dirs",
  "dep:tempfile",
  "dep:url",
  "dep:tabled",
]

[dependencies]
tokio = { version = "1", features = [
  "sync",
  "time",
  "macros",
  "rt-multi-thread",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
futures-core = "0.3"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] } # AbortOnDropHandle
rusqlite = { version = "0.34", features = ["bundled"] }
rusqlite_migration = "2"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
tiny-keccak = { version = "2", features = ["keccak"] }
alloy = { version = "1", features = [
  "provider-http",
  "provider-ws",
  "pubsub",
  "rpc-types",
  "sol-types",
  "json-abi",
  # RequestPacket, for the rpc-timing layer in `evm::transport`.
  "json-rpc",
], optional = true }
tracing = "0.1"
blake3 = "1.8"
# JSON-RPC 2.0 framing + batching for the bitcoind client. Only the
# dependency-free `client_async` machinery — the wire transport is our own
# reqwest-backed `Transport` impl in `bitcoin::transport`.
jsonrpc = { version = "0.20", default-features = false, features = [
  "client_async",
], optional = true }
# Trait-only crates (the same traits `tower` re-exports) for the timing
# layers in `observe` / `evm::transport` — no need for the full tower
# stack.
tower-layer = "0.3"
tower-service = "0.3"
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
], optional = true }
chrono = { version = "0.4", optional = true }
toml = { version = "0.8", optional = true }
dirs = { version = "6", optional = true }
tempfile = { version = "3", optional = true }
# reqwest's own URL crate, taken directly for `Host` matching (the implicit
# bitcoind-cookie fallback in the CLI is loopback-only).
url = { version = "2", optional = true }
bytesize = "2"
# Table rendering for the CLI (funneled through `bin/chainfold/table.rs`).
# `ansi` keeps column widths correct when cells embed OSC-8 hyperlinks/SGR;
# default `derive` is unused (rows are Vec<Cell>, not structs).
tabled = { version = "0.20", default-features = false, features = [
  "std",
  "ansi",
], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
futures-util = "0.3"
tempfile = "3"
alloy = { version = "1", features = [
  "provider-http",
  "provider-ws",
  "pubsub",
  "rpc-types",
  "sol-types",
  "contract",
  "json-abi",
] }
alloy-node-bindings = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
dotenvy = "0.15"
# Regtest bitcoind harness for the bitcoin integration tests (the anvil
# analog). No `download` feature — the binary comes from $BITCOIND_EXE or
# PATH; the version feature only types the bundled convenience client.
corepc-node = { version = "0.12.0", default-features = false, features = [
  "28_2",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
# Examples render their summary tables with tabled directly (they can't
# import the bin-private funnel module).
tabled = { version = "0.20", default-features = false, features = [
  "std",
  "ansi",
] }

# Unreleased fix for the E0365 future-incompat warning (`pub use proc_macro`);
# drop once upstream merges GnomedDev/proc-macro-error-2#14 and cuts a release.
[patch.crates-io]
proc-macro-error2 = { git = "https://github.com/fgardt/proc-macro-error-2", rev = "53ff94b61c678593158db1a3d50269c6f0de0db7" }

[[bin]]
name = "chainfold"
path = "src/bin/chainfold/main.rs"
required-features = ["cli"]

[[test]]
name = "anvil_smoke"
required-features = ["evm"]

[[test]]
name = "mock_provider_smoke"
required-features = ["evm"]

[[test]]
name = "blocks_history"
required-features = ["evm"]

[[test]]
name = "cache_layering"
required-features = ["evm"]

[[test]]
name = "live_follow"
required-features = ["evm"]

[[test]]
name = "hist_store"

[[test]]
name = "interleave"

[[test]]
name = "matcher"

[[test]]
name = "owned_erc20"
required-features = ["evm"]

[[test]]
name = "bitcoin_blocks_history"
required-features = ["bitcoin"]

[[example]]
name = "history_explorer"
required-features = ["evm"]

[[example]]
name = "erc20_explorer"
required-features = ["evm"]

[[example]]
name = "bridge_explorer"
required-features = ["evm"]

[[example]]
name = "bridge_matcher"
required-features = ["evm"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Baseline groups.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Catch the specific issues feedback has flagged before.
absolute_paths = "warn"          # forces `use` over `crate::a::b::c` chains
clone_on_ref_ptr = "warn"        # refcount bumps are spelled `.share()` (src/shared.rs)
needless_pass_by_value = "warn"
redundant_clone = "warn"
explicit_iter_loop = "warn"
explicit_into_iter_loop = "warn"
unused_async = "warn"
# Common pedantic noise we don't care about in a CLI / library.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
struct_excessive_bools = "allow"
# Don't fight the `_` underscore-bound naming when we're documenting params.
similar_names = "allow"
# EVM numeric work routinely converts between u32/u64/usize/i64 (SQLite)
# at known-safe boundaries. Forcing try_into chains everywhere produces
# more noise than it catches.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
# Long functions are usually long for a reason in this codebase (state
# machines, schema migrations, integration scenarios).
too_many_lines = "allow"
# `let _ = future_with_unit_result();` reads fine and is widely used.
ignored_unit_patterns = "allow"
# `Hist::iter`/`HistBackend::iter` return a Stream, not Iterator — the name
# is part of the trait/API surface and matches the conceptual operation.
iter_not_returning_iterator = "allow"
# Clap's `EvmArgs` is large relative to the small `Config { action }` arm.
# Splitting the enum into boxed variants would obscure the CLI surface.
large_enum_variant = "allow"
# CLI run functions thread provider+cache+args+chain_id+flags — splitting
# them into structs to satisfy a 7-arg cap costs clarity.
too_many_arguments = "allow"
# Items defined inside a function body after let-statements are a clarity
# choice; allow it for local helper fns near their call site.
items_after_statements = "allow"
