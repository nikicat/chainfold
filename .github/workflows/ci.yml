name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every rolling input is pinned so CI only moves when a pin is bumped:
# the Rust toolchain in rust-toolchain.toml (shared with local dev), the
# actions by hash, and the gate tools by version here.

jobs:
  ci:
    name: fmt + taplo + clippy + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install Rust toolchain
        # Reads rust-toolchain.toml (channel + components) — must run after
        # checkout, and before rust-cache probes `rustc -vV`.
        run: rustup toolchain install

      - name: Install gate tools
        # shellcheck isn't a gate step itself — actionlint shells out to it
        # for `run:` blocks.
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: taplo@0.10.0,just@1.55.1,shellcheck@0.11.0

      - name: Install actionlint + yamllint
        # actionlint isn't in install-action's manifest set; pull the
        # release tarball and verify its published checksum. yamllint via
        # pipx (preinstalled on the runner; PEP 668 blocks bare pip).
        run: |
          curl -sSfLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c
          sudo tar xzf actionlint.tar.gz -C /usr/local/bin actionlint
          rm actionlint.tar.gz
          pipx install yamllint==1.38.0

      - name: Cache cargo registry and target
        # rust-cache prunes before saving (drops workspace-own artifacts,
        # incremental state, and lockfile-stale deps), so the cache stays
        # bounded — raw actions/cache with restore-keys grew a superset
        # every generation until the runner disk overflowed.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: taplo fmt
        run: taplo fmt --check

      - name: taplo lint
        run: taplo lint

      - name: actionlint
        run: actionlint

      - name: yamllint
        run: yamllint .

      - name: just fmt
        run: just --unstable --fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: build (no-default-features)
        run: cargo build --all-targets --no-default-features --locked

      - name: build (all features)
        run: cargo build --all-targets --all-features --locked

      - name: test
        # Anvil-backed and fork tests are #[ignore]'d; default `cargo test`
        # skips them, so no extra filter is needed here.
        run: cargo test --all-features --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Runs in parallel to the main `ci` job.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install Rust toolchain
        # Reads rust-toolchain.toml (channel + components, incl.
        # llvm-tools-preview for cargo-llvm-cov).
        run: rustup toolchain install

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Cache cargo registry and target
        # Keyed per job automatically, so this stays separate from the
        # `ci` job's cache (as the old -coverage- key did).
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true

      - name: Collect coverage (lcov)
        # Anvil/fork tests are #[ignore]'d and excluded for the same
        # reasons as the main test step. The regex strips CLI glue and
        # shared test helpers; library code in src/ (minus src/bin/)
        # is what we measure.
        run: |
          cargo llvm-cov --all-features --locked \
            --ignore-filename-regex '(examples/|src/bin/|tests/common/|tests_common\.rs)' \
            --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6.0.2
        with:
          files: lcov.info
          # Without this the uploader's auto-search also grabs
          # src/cache/coverage.rs (filename matches its report pattern).
          disable_search: true
          fail_ci_if_error: false
          # Repo is private; CODECOV_TOKEN must be set as an Actions
          # secret. Public repos on GitHub can drop this and use OIDC.
          token: ${{ secrets.CODECOV_TOKEN }}
