name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: fmt + taplo + clippy + build + test
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git pkgconf pacman rustup taplo-cli \
            actionlint yamllint shellcheck just
          rustup default stable
          rustup component add rustfmt clippy

      - uses: actions/checkout@v6

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: taplo fmt
        run: taplo fmt --check

      - name: taplo lint
        run: taplo lint

      - name: actionlint
        run: actionlint

      - name: yamllint
        run: yamllint .

      - name: just fmt
        run: just --unstable --fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: build (no-default-features)
        run: cargo build --all-targets --no-default-features --locked

      - name: build (all features)
        run: cargo build --all-targets --all-features --locked

      - name: test
        # Anvil-backed and fork tests are #[ignore]'d; default `cargo test`
        # skips them, so no extra filter is needed here.
        run: cargo test --all-features --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Runs in parallel to the main `ci` job. Uses stock GitHub runner
    # rather than the Arch container so cargo-llvm-cov's binary install
    # action works without extra plumbing.
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-

      - name: Collect coverage (lcov)
        # Anvil/fork tests are #[ignore]'d and excluded for the same
        # reasons as the main test step. The regex strips CLI glue and
        # shared test helpers; library code in src/ (minus src/bin/)
        # is what we measure.
        run: |
          cargo llvm-cov --all-features --locked \
            --ignore-filename-regex '(examples/|src/bin/|tests/common/|tests_common\.rs)' \
            --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false
          # Repo is private; CODECOV_TOKEN must be set as an Actions
          # secret. Public repos on GitHub can drop this and use OIDC.
          token: ${{ secrets.CODECOV_TOKEN }}
